<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page Not Found — Max Rome Executive Chauffeur</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet" />
    <style>
      :root { --gold: #b8860b; --cream: #fffef9; --border: #e8e5df; --text: #1a1a1a; --muted: #5a5a5a; }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: "DM Sans", ui-sans-serif, system-ui, sans-serif;
        background: var(--cream); color: var(--text);
        min-height: 100vh; display: flex; flex-direction: column;
        -webkit-font-smoothing: antialiased;
      }
      main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 48px 24px; }
      .card { max-width: 520px; text-align: center; }
      .logo {
        width: 64px; height: 64px; border-radius: 50%; margin: 0 auto 24px;
        background: linear-gradient(135deg, #b8860b, #d4a437);
        color: #fff; font-family: "Playfair Display", Georgia, serif;
        font-weight: 700; font-size: 20px;
        display: flex; align-items: center; justify-content: center;
      }
      h1 { font-family: "Playfair Display", Georgia, serif; font-size: 3rem; font-weight: 600; }
      p { color: var(--muted); margin: 16px 0 32px; line-height: 1.7; }
      .btn {
        display: inline-block; background: linear-gradient(90deg, #b8860b, #d4a437);
        color: #fff; text-decoration: none; font-weight: 600; font-size: 15px;
        padding: 14px 32px; border-radius: 9999px;
        box-shadow: 0 8px 24px rgba(184, 134, 11, .3);
        transition: box-shadow .2s;
      }
      .btn:hover { box-shadow: 0 12px 32px rgba(184, 134, 11, .4); }
      .links { margin-top: 32px; font-size: 14px; }
      .links a { color: var(--gold); text-decoration: none; margin: 0 10px; }
      .links a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <main>
      <div class="card">
        <div class="logo">MR</div>
        <h1>404</h1>
        <p>This road doesn't exist — and neither does this page.<br />Let's get you back to Rome.</p>
        <a class="btn" href="/">Back to Homepage</a>
        <div class="links">
          <a href="/#routes">Routes</a>·
          <a href="/#book">Book a Ride</a>·
          <a href="/#contact">Contact</a>
        </div>
      </div>
    </main>
  </body>
</html>
